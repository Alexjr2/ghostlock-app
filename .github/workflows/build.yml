name: Build CI (Release)

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'TAG Required'
        required: true

permissions:
  contents: write

env:
  ONDK_VERSION: "r30.1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@main
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          cache-disabled: true

      - name: Download ONDK
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/*.apk GhostLock.apk

      - name: Create Release
        uses: ncipollo/release-action@main
        with:
          tag: ${{ github.event.inputs.TAG }}
          name: GhostLock
          allowUpdates: true
          artifacts: GhostLock.apk